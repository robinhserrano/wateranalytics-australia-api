services:
    app:
        build:
            context: .
            dockerfile: deployment/Dockerfile
            args:
                - VITE_POSTHOG_KEY=${VITE_POSTHOG_KEY}
                - VITE_POSTHOG_HOST=${VITE_POSTHOG_HOST}
                - VITE_APP_ENV=${APP_ENV}
        container_name: laravel-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./.env:/var/www/.env
            - storage:/var/www/storage
            - assets_build:/var/www/public/build
        networks:
            - app-network
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

    web:
        image: nginx:alpine
        container_name: nginx-web
        restart: unless-stopped
        # certbot renews certs on its own schedule but has no way to tell nginx
        # to pick them up. Reloading nginx every 6h is a harmless no-op when the
        # cert hasn't changed, and is what actually applies a renewed cert.
        entrypoint: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./public:/var/www/public
            - ./${NGINX_CONF:-deployment/nginx-http.conf}:/etc/nginx/conf.d/default.conf:ro
            - assets_build:/var/www/public/build:ro
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        depends_on:
            - app
        networks:
            - app-network

    mysql:
        image: mysql:8.4
        container_name: mysql-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
            interval: 5s
            timeout: 5s
            retries: 10

    # Queue Worker (Background Jobs)
    queue:
        build:
            context: .
            dockerfile: deployment/Dockerfile
            args:
                - VITE_POSTHOG_KEY=${VITE_POSTHOG_KEY}
                - VITE_POSTHOG_HOST=${VITE_POSTHOG_HOST}
                - VITE_APP_ENV=${APP_ENV}
        container_name: laravel-queue
        restart: unless-stopped
        working_dir: /var/www
        command: "php artisan horizon"
        stop_signal: SIGTERM
        stop_grace_period: 90s
        volumes:
            - ./.env:/var/www/.env
            - storage:/var/www/storage
        depends_on:
            - app
            - mysql
            - redis
        networks:
            - app-network

    # Task Scheduler (Cron)
    scheduler:
        build:
            context: .
            dockerfile: deployment/Dockerfile
        container_name: laravel-scheduler
        restart: unless-stopped
        working_dir: /var/www
        command: "sh -c 'while true; do php artisan schedule:run --verbose --no-interaction && touch /tmp/scheduler-heartbeat; sleep 60; done'"
        healthcheck:
            test: ["CMD-SHELL", "find /tmp/scheduler-heartbeat -mmin -2 | grep ."]
            interval: 60s
            timeout: 10s
            retries: 3
        volumes:
            - ./.env:/var/www/.env
            - storage:/var/www/storage
        depends_on:
            - app
            - mysql
            - redis
        networks:
            - app-network

    # Nightwatch Agent (Performance and Error Monitoring)
    nightwatch:
        build:
            context: .
            dockerfile: deployment/Dockerfile
            args:
                - VITE_POSTHOG_KEY=${VITE_POSTHOG_KEY}
                - VITE_POSTHOG_HOST=${VITE_POSTHOG_HOST}
                - VITE_APP_ENV=${APP_ENV}
        container_name: laravel-nightwatch
        restart: unless-stopped
        working_dir: /var/www
        command: "php artisan nightwatch:agent"
        volumes:
            - ./.env:/var/www/.env
            - storage:/var/www/storage
        depends_on:
            - app
            - mysql
            - redis
        networks:
            - app-network

    certbot:
        image: certbot/certbot
        container_name: certbot
        volumes:
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

    redis:
        image: redis:alpine
        container_name: laravel-redis
        restart: unless-stopped
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 3

networks:
    app-network:
        driver: bridge

volumes:
    dbdata:
        driver: local
    storage:
        driver: local
    assets_build:
        driver: local
